<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Not found')}"><title>Not found</title></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="container auth-shell">
    <div class="form-panel">
        <h1>404 — Not found</h1>
        <p class="panel-lead">That link may be outdated, or the title was removed from the catalog.</p>

        <div class="callout error">
            The page or movie you are looking for does not exist.
        </div>

        <div class="form-actions">
            <a class="button" th:href="@{/}">Back to the catalog</a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
