<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Access denied')}"><title>Access denied</title></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="container auth-shell">
    <div class="form-panel">
        <h1>403 — Access denied</h1>
        <p class="panel-lead">This area is restricted to administrators.</p>

        <div class="callout error">
            Your account does not have permission to open this page.
        </div>

        <div class="form-actions">
            <a class="button" th:href="@{/}">Back to the catalog</a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
